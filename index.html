<style>
  :root{
    --ink:#1b1b1b;
    --coral:#f14b3d;
    --coral-dark:#d8382b;
    --paper:#faf9f7;
    --line:#e9e5df;
    --muted:#8a857e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Helvetica Neue', Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    box-shadow:0 0 40px rgba(0,0,0,0.06);
  }

  /* Header */
  .header{
    background:var(--ink);
    color:#fff;
    padding:52px 32px 36px;
    text-align:center;
    position:relative;
  }
  .avatar{
    width:84px;
    height:84px;
    border-radius:50%;
    background:var(--coral);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:700;
    margin:0 auto 20px;
    letter-spacing:0.5px;
  }
  .name{
    font-size:28px;
    font-weight:800;
    letter-spacing:0.5px;
    margin:0 0 6px;
    text-transform:uppercase;
  }
  .title{
    font-size:15px;
    color:var(--coral);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:0;
  }
  .org{
    font-size:13px;
    color:#c9c6c1;
    margin-top:10px;
    letter-spacing:0.3px;
  }

  /* Action buttons */
  .actions{
    display:flex;
    background:var(--coral);
  }
  .actions a{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding:20px 8px;
    color:#fff;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    border-right:1px solid rgba(255,255,255,0.18);
  }
  .actions a:last-child{border-right:none;}
  .actions svg{width:22px;height:22px;}
  .actions a:active{background:var(--coral-dark);}

  /* Details */
  .details{padding:8px 0 100px;}
  .item{
    display:flex;
    gap:18px;
    padding:22px 32px;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:var(--ink);
  }
  .item:hover{background:#f4f1ec;}
  .icon{
    width:22px;height:22px;flex-shrink:0;margin-top:2px;color:var(--coral);
  }
  .item-main{font-size:17px;font-weight:500;word-break:break-word;}
  .item-label{font-size:13px;color:var(--muted);margin-top:3px;}

  /* Floating save button */
  .fab{
    position:fixed;
    bottom:28px;
    right:28px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:var(--coral);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    box-shadow:0 8px 20px rgba(241,75,61,0.4);
    max-width:480px;
  }
  .fab svg{width:26px;height:26px;}

  footer{
    text-align:center;
    padding:18px;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.5px;
  }
</style>
